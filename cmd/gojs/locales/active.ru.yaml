- id: matrix_hint_heal
  translation: "Данные за выбранный на таймлайне интервал времени.<br/>Строки — получатель лечения, столбцы — кто лечит (внутри команды).<br/>Цвет ячейки: насыщенность по доле от максимума в этой строке (на кого/чей пул лечения приходится больше всего). Наведите на ячейку — доли от строки и от суммы таблицы."
- id: matrix_hint_kill
  translation: "Данные за выбранный на таймлайне интервал времени.<br/>Строки — игроки этой команды (источник килла), столбцы — вражеская команда (цель).<br/>Цвет ячейки: насыщенность по доле от максимума в строке (главные «пары» киллов). Наведите на ячейку — доли от строки и от суммы таблицы."
- id: matrix_hint_damage
  translation: "Данные за выбранный на таймлайне интервал времени.<br/>Строки — игроки этой команды (источник урона), столбцы — вражеская команда (цель).<br/>Цвет ячейки: насыщенность по доле от максимума в строке (на кого этот источник тратил урон сильнее всего). Наведите на ячейку — доли от строки и от суммы таблицы."
